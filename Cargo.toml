[package]
name = "ptsd2"
version = "0.2.0"
edition = "2024"
description = "Crate built to bridge design systems to Prism"
license = "BSD-3-Clause"
repository = "https://github.com/ramp-stack/ptsd"

[lib]
name = "ptsd"
path = "src/lib.rs"

[dependencies]
uuid = { version = "1.16.0", features = ["v4", "js"] }
hex = "0.4.3"
include_dir = "0.7.4"
prism = {package = "prism2", version = "3.1.0"}
chrono = "0.4.42"
downcast-rs = "2.0.2"
dyn-clone = "1.0.20"
